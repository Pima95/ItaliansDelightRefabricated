name: Vineyard Chili 1.2.0 CI
on:
  push:
    branches:
      - feature/vineyard-chili-1.2.0
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify development branch
        run: |
          grep -Fx 'mod_version=1.2.0-mc26.3-dev' gradle.properties
          grep -Fx 'minecraft_version=26.3' gradle.properties
          test -f docs/vineyard-chili-1.2.0/ROADMAP.md
          test -f docs/vineyard-chili-1.2.0/DESIGN.md
          test -f src/main/resources/assets/italiansdelight/textures/item/grape.png
      - name: Audit JSON and recipes
        run: python3 .github/scripts/audit_project_consistency.py
      - name: Check vineyard, stake, wine fluid models and tags
        run: python3 .github/scripts/check_vineyard_supports.py
      - name: Build Java 25 experimental artifact
        run: bash ./gradlew build --no-daemon --max-workers=2 --console=plain
      - name: Verify JAR
        run: |
          python3 - <<'PY'
          import json, zipfile
          path = 'build/libs/italiansdelight-1.2.0-mc26.3-dev.jar'
          with zipfile.ZipFile(path) as jar:
              m = json.loads(jar.read('fabric.mod.json'))
              assert m['version'] == '1.2.0-mc26.3-dev'
              assert m['depends']['minecraft'] == '~26.3'
              assert m['depends']['java'] == '>=25'
              # Inspect the actual JAR, not just the source directory:
              # Minecraft client loads these bundled assets for all ages.
              for block, model_prefix, parent, texture_key in (
                  ('chili_crop', 'chili_free_stage_', 'farmersdelight:block/template_crop_cross', 'cross'),
                  ('chili_on_rope', 'chili_rope_stage_', 'farmersdelight:block/template_crop_with_rope', 'crop'),
              ):
                  path = f'assets/italiansdelight/blockstates/{block}.json'
                  states = json.loads(jar.read(path))['variants']
                  assert len(states) == (16 if block == 'chili_crop' else 8)
                  for age in range(8):
                      keys = [f'age={age},ropelogged={flag}' for flag in ('false', 'true')] if block == 'chili_crop' else [f'age={age}']
                      for key in keys:
                          model = states[key]['model'].split(':')[1]
                          stage = 0 if age < 2 else 1 if age < 4 else 2 if age < 7 else 3
                          assert model == f'block/{model_prefix}{stage}', key
                          model_path = f'assets/italiansdelight/models/{model}.json'
                          data = json.loads(jar.read(model_path))
                          assert data['parent'] == parent
                          assert data['render_type'] == 'minecraft:cutout'
                          texture = data['textures'][texture_key]
                          assert texture == f'italiansdelight:block/chili_crop_{stage}'
                          sprite = f'assets/italiansdelight/textures/{texture.split(":")[1]}.png'
                          assert jar.getinfo(sprite).file_size > 80
              assert 'dev/italiansdelight/common/block/WildBasilBlock.class' in jar.namelist()
              assert 'dev/italiansdelight/common/block/CardoonBlock.class' in jar.namelist()
              assert 'dev/italiansdelight/common/block/ChiliCropBlock.class' in jar.namelist()
              assert 'dev/italiansdelight/common/block/HangingChiliBlock.class' in jar.namelist()
              bamboo = json.loads(jar.read('assets/italiansdelight/models/block/bamboo_crop_stake.json'))
              assert bamboo['textures']['2'] == 'minecraft:block/bamboo_fence'
              assert bamboo['elements'][0]['faces']['up']['uv'] == [4, 0, 8, 4]
              assert 'dev/italiansdelight/common/block/WildChiliBlock.class' in jar.namelist()
          print('OK: FDR TomatoBlock-style crop and rope states, 4 sprite models, wild crops and bamboo')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: italiansdelight-1.2.0-mc26.3-dev
          path: build/libs/italiansdelight-1.2.0-mc26.3-dev.jar
          if-no-files-found: error
          retention-days: 7
