name: NeoForge 1.21.1 port checks
on:
  push:
    branches: ['neoforge/mc-1.21.1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/audit_neoforge_port.py
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile full source tree (expected failures until Java port is completed)
        run: bash ./gradlew clean build --no-daemon --max-workers=2 --console=plain
      - name: Verify native JAR metadata and notices
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          jars = [p for p in Path("build/libs").glob("*.jar") if not p.name.endswith("-sources.jar")]
          assert len(jars) == 1, jars
          with zipfile.ZipFile(jars[0]) as z:
              for p in ("META-INF/neoforge.mods.toml", "LICENSE_italiansdelight", "META-INF/NOTICE",
                        "META-INF/THIRD_PARTY_NOTICES.md", "META-INF/CREDIT.md", "META-INF/FDR_CRATES_LICENSE.md"):
                  assert p in z.namelist(), p
              assert "fabric.mod.json" not in z.namelist()
              assert z.read("dev/italiansdelight/ItaliansDelight.class")[6:8] == bytes([0,61])
          PY
