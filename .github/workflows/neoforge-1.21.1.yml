name: NeoForge 1.21.1 port checks
on:
  push:
    branches: ['neoforge/mc-1.21.1']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neoforge-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/audit_neoforge_port.py
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile full source tree and package native JAR
        run: bash ./gradlew clean build --no-daemon --max-workers=2 --console=plain
      - name: Verify native JAR metadata and notices
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          jars = [p for p in Path("build/libs").glob("*.jar") if not p.name.endswith("-sources.jar")]
          assert len(jars) == 1, jars
          with zipfile.ZipFile(jars[0]) as z:
              for p in ("META-INF/neoforge.mods.toml", "LICENSE_italiansdelight", "META-INF/NOTICE",
                        "META-INF/THIRD_PARTY_NOTICES.md", "META-INF/CREDIT.md", "META-INF/FDR_CRATES_LICENSE.md"):
                  assert p in z.namelist(), p
              assert "fabric.mod.json" not in z.namelist()
              major = int.from_bytes(z.read("dev/italiansdelight/ItaliansDelight.class")[6:8], "big")
              assert major == 65, f"Expected Java 21 classfile major 65, got {major}"
          PY

  compile-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Windows clean build in isolated NeoForge directory
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon --no-parallel --max-workers=2 --console=plain
      - name: Verify isolated Windows output
        shell: pwsh
        run: |
          if (!(Test-Path 'build-neoforge/libs')) { throw 'NeoForge output directory missing' }
          if (!(Get-ChildItem 'build-neoforge/libs/*.jar' | Where-Object { $_.Name -notlike '*-sources.jar' })) { throw 'Native JAR missing' }
      - name: Repeat Java compilation to exercise generated output cleanup
        shell: pwsh
        run: .\gradlew.bat compileJava --rerun-tasks --no-daemon --no-parallel --max-workers=2 --console=plain
  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        serene: ['false', 'true']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot NeoForge GameTest server and verify port
        run: bash ./gradlew runGameTestServer -Pwith_serene_seasons=${{ matrix.serene }} --no-daemon --max-workers=2 --console=plain
      - name: Reject silently skipped datapack resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path("run-neoforge/gametest/logs/latest.log")
          assert log.is_file(), "Missing runtime log"
          errors = [line for line in log.read_text(encoding="utf-8", errors="replace").splitlines()
                    if re.search(r"Parsing error loading (?:custom advancement|recipe) italiansdelight:|Couldn't (?:read|load) tag.*mod/italiansdelight|Couldn't (?:parse|load) loot table italiansdelight:", line)]
          assert not errors, "\n".join(errors)
          PY
      - name: Upload GameTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-gametest-logs-serene-${{ matrix.serene }}
          path: |
            run-neoforge/gametest/logs/
            run-neoforge/gametest/crash-reports/
          if-no-files-found: ignore
