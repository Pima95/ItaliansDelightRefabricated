# One-time, narrowly scoped cleanup of the branch accidentally created
# during Orchard 1.1.0 preparation. Remove this workflow immediately
# after this one job completes.
name: One-off remove accidental Orchard review branch
on:
  push:
    branches:
      - feature/orchards-1.1.0
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'Pima95/ItaliansDelightRefabricated' && github.ref == 'refs/heads/feature/orchards-1.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete precisely the unintended review branch, never main or feature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Pima95/ItaliansDelightRefabricated"
          state=$(gh api repos/Pima95/ItaliansDelightRefabricated/pulls/12 --jq '.state')
          merged=$(gh api repos/Pima95/ItaliansDelightRefabricated/pulls/12 --jq '.merged')
          test "$state" = "closed"
          test "$merged" = "false"
          target="release/1.1.0-review"
          observed=$(gh api repos/Pima95/ItaliansDelightRefabricated/git/ref/heads/$target --jq '.object.sha')
          test "$observed" = "1be801db5221ffa6ae23e1906d0fada96caf1ba8"
          gh api --method DELETE repos/Pima95/ItaliansDelightRefabricated/git/refs/heads/$target
          echo "Deleted only $target, with expected SHA and closed PR #12."
