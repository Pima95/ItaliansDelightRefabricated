name: Minecraft 26.3 Port - Compile

on:
  push:
    branches:
      - feature/mc-26.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout porting branch
        uses: actions/checkout@v4
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Verify Poplar variants and textures
        run: python3 .github/scripts/check_poplar_26_3.py
      - name: Compile Java for Minecraft 26.3
        run: bash ./gradlew compileJava --no-daemon --stacktrace --console=plain
      - name: Build Minecraft 26.3 artifact
        run: bash ./gradlew build --no-daemon --console=plain
      - name: Upload experimental JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: italiansdelight-26.3-experimental
          path: build/libs/*jar
          if-no-files-found: error
