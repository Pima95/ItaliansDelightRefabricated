name: Pizza 1.0.0 - Build

on:
  push:
    branches:
      - feature/pizza-1.0.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and verify mod (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Verify 12x12 pizza textures (binary alpha, PNG CRC)
        run: python3 .github/scripts/check_pizza_topping_textures.py
      - name: Build mod and run configured checks
        run: bash ./gradlew clean build --no-daemon --stacktrace
