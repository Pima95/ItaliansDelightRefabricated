name: Orchard 1.1.0 - Dedicated server boot smoke

on:
  push:
    branches:
      - feature/orchards-1.1.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchard-server-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dedicated-server:
    name: Boot Fabric on a headless server (not a multiplayer test)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare an isolated, disposable test world
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nallow-flight=true\n' > run/server.properties
      - name: Start dedicated server and check for Minecraft readiness
        run: |
          set -euo pipefail
          touch server-smoke.log
          timeout --signal=INT --kill-after=10s 240s bash ./gradlew runServer --no-daemon --console=plain > server-smoke.log 2>&1 &
          runner=$!
          started=0
          for i in $(seq 1 240); do
            if grep -Eq 'Done \(' server-smoke.log; then
              started=1
              break
            fi
            if ! kill -0 "$runner" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill -INT "$runner" 2>/dev/null || true
          wait "$runner" || true
          tail -n 120 server-smoke.log
          test "$started" -eq 1
          ! grep -E '(Failed to start|Exception in server tick loop)' server-smoke.log
      - name: Save smoke logs for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchard-dedicated-server-log-${{ github.sha }}
          path: server-smoke.log
          if-no-files-found: warn
          retention-days: 14
