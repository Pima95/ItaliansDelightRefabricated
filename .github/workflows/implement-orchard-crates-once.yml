name: One-time Orchard crates implementation

on:
  push:
    branches:
      - feature/orchards-1.1.0
    paths:
      - .github/workflows/implement-orchard-crates-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/orchards-1.1.0
      - name: Install pixel art library
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Generate assets, recipes, block registrations and tests
        run: python3 .github/scripts/implement_orchard_crates_once.py
      - name: Run static regression and recipe tests
        run: |
          python3 .github/scripts/check_orchard_crates.py
          python3 .github/scripts/check_orchard_fruits_creative.py
          python3 .github/scripts/check_creative_tab.py
          python3 .github/scripts/check_all_crafting_26_2.py
          python3 .github/scripts/audit_project_consistency.py
      - name: Commit all generated content to Orchard feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find .github/scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          git diff --cached --check
          git commit -m "feat(orchards): implement 5 crop crates and resize cherry fruits"
          git push origin HEAD:feature/orchards-1.1.0
