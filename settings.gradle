// Repository usati da Gradle per risolvere i plugin del progetto, incluso Fabric Loom.
pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

// Nome logico del progetto Gradle; non deve essere confuso con il mod id.
rootProject.name = 'italiansdelight'
