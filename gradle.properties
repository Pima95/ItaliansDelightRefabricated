# ===================================
# Gradle Properties - Italian's Delight
# ===================================
# Maximum memory allocated to the Gradle process.
org.gradle.jvmargs=-Xmx3G
# Allows Gradle to execute independent tasks in parallel.
org.gradle.parallel=true

# --- Minecraft / toolchain (always verify on fabricmc.net -> "Develop" before each build) ---
minecraft_version=26.2
loader_version=0.20.1

# --- Mod ---
# These values are reused by build.gradle and fabric.mod.json.
mod_version=1.0.0
maven_group=dev.italiansdelight
archives_base_name=italiansdelight

# --- Dependencies ---
# Update these versions only after verifying compatibility with MC 26.2.
# Fabric API (latest confirmed stable build targeting Minecraft 26.2)
fabric_version=0.161.0+26.2

# Farmer's Delight Refabricated (required dependency, via Cassian's Maven)
# FDR 3.6.29 for Minecraft 26.2, published 19 October 2026.
fdrf_version=26.2-3.6.29+refabricated
