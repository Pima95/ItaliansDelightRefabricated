# ===================================
# Gradle Properties - Italian's Delight
# ===================================
# Memoria massima assegnata al processo Gradle.
org.gradle.jvmargs=-Xmx3G
# Consente a Gradle di eseguire task indipendenti in parallelo.
org.gradle.parallel=true

# --- Minecraft / toolchain (verificare sempre su fabricmc.net -> "Develop" prima di ogni build) ---
minecraft_version=26.2
loader_version=0.19.5

# --- Mod ---
# Questi valori vengono riutilizzati da build.gradle e fabric.mod.json.
mod_version=0.1.0
maven_group=com.piergiuseppe.italiansdelight
archives_base_name=italiansdelight

# --- Dependencies ---
# Aggiornare queste versioni soltanto dopo aver verificato la compatibilità con MC 26.2.
# Fabric API (ultima build pubblicata per 26.2 al momento della stesura)
fabric_version=0.161.0+26.2

# Farmer's Delight Refabricated (dipendenza hard, via Cassian's Maven)
# Aggiornare al numero di versione FDR corrente per 26.2 prima della prima build.
fdrf_version=26.2-3.6.26+refabricated
