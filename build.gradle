// Build script principale della mod.
 // Loom prepara l'ambiente Fabric/Minecraft; maven-publish servirà per
 // eventuali pubblicazioni future degli artefatti.
plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Repository aggiuntivi necessari per dipendenze non disponibili su Maven Central.
repositories {
    // Farmer's Delight Refabricated
    maven {
        name = "Cassian's Maven"
        url = 'https://maven.cassian.cc'
    }

    // JEI - CurseForge Maven
    maven {
        name = "CurseForge"
        url = "https://www.cursemaven.com"
    }
}

// Dipendenze di runtime/compilazione della mod.
dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Fabric Loader
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Farmer's Delight Refabricated
    implementation("vectorwing:FarmersDelight:${project.fdrf_version}") {
        exclude(group: "net.fabricmc")
    }

    // JEI
    implementation "curse.maven:jei-238222:8937443"
}

// Sostituisce il placeholder della versione dentro fabric.mod.json durante la build.
processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Minecraft 26.2 richiede Java 25: il release target impedisce l'uso accidentale
// di bytecode o API appartenenti a versioni Java differenti.
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

// Configurazione della toolchain sorgente/target e generazione del sources JAR.
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

// Include la licenza nel JAR finale con un nome legato all'artefatto.
jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
