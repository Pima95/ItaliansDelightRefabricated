plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// Windows IDEs and antivirus scanners can retain handles in the build
// directory used by the Fabric branches. Keep NeoForge outputs separate.
// A custom absolute path can be supplied for a locked/synchronized checkout.
def portBuildDir = providers.gradleProperty('portBuildDir')
if (portBuildDir.isPresent()) {
    layout.buildDirectory.set(project.file(portBuildDir.get()))
} else if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
    layout.buildDirectory.set(layout.projectDirectory.dir('build-neoforge'))
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    // During the port, capture every compiler diagnostic rather than only the first 100.
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

repositories {
    maven {
        name = 'CurseForge'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'JEI upstream'
        url = 'https://dvs1.progwml6.com/files/maven/'
        content { includeGroup 'mezz.jei' }
    }
}

// Mutually exclusive optional thirst integrations for development/CI only.
def withCreate = providers.gradleProperty('with_create').orElse('false').get().toBoolean()
def thirstProfile = providers.gradleProperty('portThirst').orElse('none').get()
if (!(thirstProfile in ['none', 'twt', 'twt2', 'tan'])) {
    throw new GradleException("Unknown portThirst profile: " + thirstProfile)
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('run-neoforge/client')
            if (providers.gradleProperty('portClientSmoke').orElse('false').get().toBoolean()) {
                systemProperty 'italiansdelight.portClientSmoke', 'true'
                systemProperty 'italiansdelight.portClientSmokeJei', providers.gradleProperty('with_jei').orElse('false').get()
            }
        }
        server {
            server()
            gameDirectory = project.file('run-neoforge/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-neoforge/gametest')
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', 'italiansdelight'
            systemProperty 'italiansdelight.portThirst', thirstProfile
            systemProperty 'italiansdelight.portCreate', withCreate.toString()
        }
    }
    mods {
        italiansdelight { sourceSet(sourceSets.main) }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Native NeoForge Farmer's Delight 1.3.4; required.
    implementation "curse.maven:farmers-delight-398521:${project.fd_file_id}"
    // Match the upstream approach: compile against APIs, optional runtime.
    compileOnly "mezz.jei:jei-1.21.1-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${project.jei_version}"
    if (providers.gradleProperty('with_jei').orElse('false').get().toBoolean()) {
        localRuntime "mezz.jei:jei-1.21.1-neoforge:${project.jei_version}"
    }
    // Optional Serene Seasons and its required API dependency.
    compileOnly "curse.maven:serene-seasons-291874:${project.serene_seasons_file_id}"
    compileOnly "curse.maven:glitchcore-955399:${project.glitchcore_file_id}"
    if (providers.gradleProperty('with_serene_seasons').orElse('false').get().toBoolean()) {
        localRuntime "curse.maven:serene-seasons-291874:${project.serene_seasons_file_id}"
        localRuntime "curse.maven:glitchcore-955399:${project.glitchcore_file_id}"
    }
    if (thirstProfile == 'twt') {
        localRuntime "curse.maven:thirst-was-taken-679270:${project.twt_file_id}"
    } else if (thirstProfile == 'twt2') {
        localRuntime "curse.maven:thirst-was-taken-2-1700787:${project.twt2_file_id}"
    } else if (thirstProfile == 'tan') {
        localRuntime "curse.maven:tough-as-nails-246391:${project.tan_file_id}"
        if (!providers.gradleProperty('with_serene_seasons').orElse('false').get().toBoolean()) {
            localRuntime "curse.maven:glitchcore-955399:${project.glitchcore_file_id}"
        }
    }
    // Official Create distribution includes its bundled dependencies. The
    // profile is runtime-only; no Create classes in production code.
    if (withCreate) {
        localRuntime "curse.maven:create-328085:${project.create_file_id}"
    }
    // Thirst/automation integrations are data-driven unless the port audit proves otherwise.
    // Do not install Fabric artifacts or make optional integrations mandatory.
}

processResources {
    def props = [version: project.version, neo_version_range: project.neo_version_range,
                 minecraft_version_range: project.minecraft_version_range,
                 loader_version_range: project.loader_version_range]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }

    // The branch shares the recipe vocabulary of the newer Fabric source.
    // Normalize only ingredient positions; do not rewrite result stacks,
    // component data, counts, recipe IDs or recipe-specific numeric values.
    inputs.property('legacyIngredientSchema', 2)
    inputs.property('legacyAdvancementSchema', 1)
    inputs.property('legacyLootSchema', 1)
    inputs.property('legacyClientTextures', 2)
    doLast {

        // The legacy static whey PNG cannot be decoded by STB or ImageIO.
        // Recreate only that legacy alias from frame zero of the approved,
        // working animated whey texture. The animated asset stays unchanged.
        def whey = new File(destinationDir, 'assets/italiansdelight/textures/block/liquid_surface/whey.png')
        def wheyImage = javax.imageio.ImageIO.read(new File(destinationDir,
            'assets/italiansdelight/textures/block/fluids/whey_still.png'))
        if (wheyImage == null || wheyImage.height < wheyImage.width)
            throw new GradleException('Unreadable animated whey source')
        def rgba = new java.awt.image.BufferedImage(wheyImage.width, wheyImage.width, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        rgba.setRGB(0, 0, wheyImage.width, wheyImage.width,
            wheyImage.getRGB(0, 0, wheyImage.width, wheyImage.width, null, 0, wheyImage.width), 0, wheyImage.width)
        if (!javax.imageio.ImageIO.write(rgba, 'PNG', whey)) throw new GradleException('PNG writer unavailable')

        // No legacy almond entity UV sprite was present. Prefer the approved
        // block sign art when it already has the vanilla 64x32 UV dimensions;
        // otherwise tile the original almond plank art across that UV canvas.
        // Leave the modern source textures and inventory art untouched.
        def textures = new File(destinationDir, 'assets/italiansdelight/textures')
        def almondPlanks = javax.imageio.ImageIO.read(new File(textures, 'block/almond_planks.png'))
        if (almondPlanks == null) throw new GradleException('Missing almond plank texture')
        ['sign', 'hanging_sign'].each { kind ->
            def original = javax.imageio.ImageIO.read(new File(textures, "block/almond_${kind}.png"))
            def target = new File(textures, kind == 'sign' ? 'entity/signs/almond.png' : 'entity/signs/hanging/almond.png')
            target.parentFile.mkdirs()
            def img = original != null && original.width == 64 && original.height == 32 ? original :
                new java.awt.image.BufferedImage(64, 32, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            if (img != original) {
                for (int y = 0; y < 32; y++) for (int x = 0; x < 64; x++)
                    img.setRGB(x, y, almondPlanks.getRGB(x % almondPlanks.width, y % almondPlanks.height))
            }
            if (!javax.imageio.ImageIO.write(img, 'PNG', target)) throw new GradleException('PNG writer unavailable')
        }

        def slurper = new groovy.json.JsonSlurper()
        def convertIngredient
        convertIngredient = { value ->
            if (value instanceof String) {
                if (value == 'minecraft:iron_chain') value = 'minecraft:chain'
                if (value.startsWith('#')) return [tag: value.substring(1)]
                return [item: value]
            }
            if (value instanceof List) {
                def children = value.collect { convertIngredient(it) }
                if (children.isEmpty()) throw new GradleException('Empty recipe ingredient alternatives')
                return children.size() == 1 ? children[0] : [type: 'neoforge:compound', children: children]
            }
            if (value instanceof Map) {
                def copy = new LinkedHashMap(value)
                if (copy['fabric:type'] == 'fabric:any') return convertIngredient(copy.ingredients)
                if (copy['fabric:type'] == 'fabric:components') {
                    if (!(copy.base instanceof String) || copy.base.startsWith('#') || !(copy.components instanceof Map))
                        throw new GradleException("Unsupported component ingredient: " + copy)
                    return [type: 'neoforge:components', items: copy.base,
                            components: copy.components, strict: false]
                }
                if (copy['fabric:type'] == 'farmersdelight:item_ability') {
                    copy.type = copy.remove('fabric:type')
                }
                if (copy.containsKey('fabric:type')) throw new GradleException("Unported ingredient: " + copy)
                if (copy.item == 'minecraft:iron_chain') copy.item = 'minecraft:chain'
                if (copy.children instanceof List) copy.children = copy.children.collect { convertIngredient(it) }
                return copy
            }
            throw new GradleException("Unsupported ingredient: " + value)
        }
        def recipes = fileTree(destinationDir) {
            include 'data/**/recipe/**/*.json'
        }
        recipes.each { recipeFile ->
            def data = slurper.parse(recipeFile)
            if (data.key instanceof Map) data.key = data.key.collectEntries { k, v -> [(k): convertIngredient(v)] }
            if (data.containsKey('ingredient')) data.ingredient = convertIngredient(data.ingredient)
            if (data.ingredients instanceof List) data.ingredients = data.ingredients.collect { convertIngredient(it) }
            if (data.containsKey('tool')) data.tool = convertIngredient(data.tool)
            if (data.containsKey('base')) data.base = convertIngredient(data.base)
            if (data.containsKey('addition')) data.addition = convertIngredient(data.addition)
            if (data.containsKey('template')) data.template = convertIngredient(data.template)
            if (data.type == 'farmersdelight:cutting' && data.sound instanceof String)
                data.sound = [sound_id: data.sound]
            recipeFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n', 'UTF-8')
        }
        logger.lifecycle("Normalized " + recipes.files.size() + " recipe resources for NeoForge 1.21.1")

        // 1.21.1 recipe-unlock criteria use singular "recipe".
        // Inventory predicates reference the old vanilla chain item ID.
        def advancements = fileTree(destinationDir) {
            include 'data/italiansdelight/advancement/**/*.json'
        }
        advancements.each { advancementFile ->
            def data = slurper.parse(advancementFile)
            data.criteria?.values()?.each { criterion ->
                if (criterion.trigger == 'minecraft:recipe_unlocked' && criterion.conditions?.recipes instanceof String) {
                    criterion.conditions.recipe = criterion.conditions.remove('recipes')
                }
                if (criterion.trigger == 'minecraft:inventory_changed') {
                    criterion.conditions?.items?.each { predicate ->
                        if (predicate.items == 'minecraft:iron_chain') predicate.items = 'minecraft:chain'
                    }
                }
            }
            advancementFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n', 'UTF-8')
        }
        logger.lifecycle("Normalized " + advancements.files.size() + " advancements for NeoForge 1.21.1")

        // 1.21.1 loot pools use conditions[] and functions[].
        // Convert only loot nodes; never touch number providers, item
        // predicates, counts or probabilities.
        def condition
        def lootFunction
        def node
        condition = { value ->
            if (!(value instanceof Map)) throw new GradleException("Invalid loot condition: " + value)
            def out = new LinkedHashMap(value)
            if (out.type instanceof String) {
                out.condition = out.remove('type')
            }
            if (out.condition == 'farmersdelight:can_item_perform_ability')
                out.condition = 'neoforge:can_item_perform_ability'
            if (out.condition == 'minecraft:match_block') {
                if (!(out.blocks instanceof String) || out.blocks.startsWith('#'))
                    throw new GradleException("Unsupported match_block form: " + out)
                out.condition = 'minecraft:block_state_property'
                out.block = out.remove('blocks')
                out.properties = out.remove('state') ?: [:]
            }
            if (out.term instanceof Map) out.term = condition(out.term)
            if (out.terms instanceof List) out.terms = out.terms.collect { condition(it) }
            return out
        }
        lootFunction = { value ->
            def out = new LinkedHashMap(value)
            if (out.type instanceof String) out.function = out.remove('type')
            return node(out)
        }
        node = { value ->
            def out = new LinkedHashMap(value)
            def conditions = []
            if (out.conditions instanceof List) conditions.addAll(out.remove('conditions'))
            if (out.condition instanceof Map) conditions.add(out.remove('condition'))
            if (!conditions.isEmpty()) out.conditions = conditions.collect { condition(it) }
            def functions = []
            if (out.functions instanceof List) functions.addAll(out.remove('functions'))
            if (out.modifier instanceof List) functions.addAll(out.remove('modifier'))
            if (out.modifier instanceof Map) functions.add(out.remove('modifier'))
            if (!functions.isEmpty()) out.functions = functions.collect { lootFunction(it) }
            ['pools', 'entries', 'children'].each { key ->
                if (out[key] instanceof List) out[key] = out[key].collect { node(it) }
            }
            return out
        }
        def lootTables = fileTree(destinationDir) {
            include 'data/**/loot_table/**/*.json'
        }
        lootTables.each { lootFile ->
            def data = node(slurper.parse(lootFile))
            lootFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n', 'UTF-8')
        }
        logger.lifecycle("Normalized " + lootTables.files.size() + " loot table resources for NeoForge 1.21.1")

    }

}

jar {
    from('LICENSE') { rename { "${it}_${project.archives_base_name}" } }
    from('NOTICE') { into('META-INF') }
    from('THIRD_PARTY_NOTICES.md') { into('META-INF') }
    from('CREDIT.md') { into('META-INF') }
    from('docs/FDR_CRATES_LICENSE.md') { into('META-INF') }
}
