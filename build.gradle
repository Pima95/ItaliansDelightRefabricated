// Main build script for the mod.
// Loom prepares the Fabric/Minecraft development environment; maven-publish
// is available for possible future artifact publishing.
plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Additional repositories required for dependencies not available on Maven Central.
repositories {
    // Farmer's Delight Refabricated
    maven {
        name = "Cassian's Maven"
        url = 'https://maven.cassian.cc'
    }

    // JEI - CurseForge Maven
    maven {
        name = "CurseForge"
        url = "https://www.cursemaven.com"
    }
}

// Mod runtime and compile-time dependencies.
dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Fabric Loader
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Farmer's Delight Refabricated
    implementation("vectorwing:FarmersDelight:${project.fdrf_version}") {
        exclude(group: "net.fabricmc")
    }

    // JEI
    implementation "curse.maven:jei-238222:8937443"
}

// Replaces the version placeholder inside fabric.mod.json during the build.
processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Minecraft 26.2 requires Java 25: the release target prevents accidental use
// of bytecode or APIs from a different Java version.
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

// Source/target toolchain configuration and sources JAR generation.
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

// Includes the license in the final JAR with an artifact-specific name.
jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
