plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    // During the port, capture every compiler diagnostic rather than only the first 100.
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

repositories {
    maven {
        name = 'CurseForge'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'JEI upstream'
        url = 'https://dvs1.progwml6.com/files/maven/'
        content { includeGroup 'mezz.jei' }
    }
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', 'italiansdelight'
        }
    }
    mods {
        italiansdelight { sourceSet(sourceSets.main) }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Native NeoForge Farmer's Delight 1.3.4; required.
    implementation "curse.maven:farmers-delight-398521:${project.fd_file_id}"
    // Match the upstream approach: compile against APIs, optional runtime.
    compileOnly "mezz.jei:jei-1.21.1-common-api:${project.jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${project.jei_version}"
    if (providers.gradleProperty('with_jei').orElse('false').get().toBoolean()) {
        localRuntime "mezz.jei:jei-1.21.1-neoforge:${project.jei_version}"
    }
    // Optional Serene Seasons and its required API dependency.
    compileOnly "curse.maven:serene-seasons-291874:${project.serene_seasons_file_id}"
    compileOnly "curse.maven:glitchcore-955399:${project.glitchcore_file_id}"
    if (providers.gradleProperty('with_serene_seasons').orElse('false').get().toBoolean()) {
        localRuntime "curse.maven:serene-seasons-291874:${project.serene_seasons_file_id}"
        localRuntime "curse.maven:glitchcore-955399:${project.glitchcore_file_id}"
    }
    // Thirst/automation integrations are data-driven unless the port audit proves otherwise.
    // Do not install Fabric artifacts or make optional integrations mandatory.
}

processResources {
    def props = [version: project.version, neo_version_range: project.neo_version_range,
                 minecraft_version_range: project.minecraft_version_range,
                 loader_version_range: project.loader_version_range]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }

    // The branch shares the recipe vocabulary of the newer Fabric source.
    // Normalize only ingredient positions; do not rewrite result stacks,
    // component data, counts, recipe IDs or recipe-specific numeric values.
    inputs.property('legacyIngredientSchema', 1)
    inputs.property('legacyLootSchema', 1)
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def convertIngredient
        convertIngredient = { value ->
            if (value instanceof String) {
                if (value.startsWith('#')) return [tag: value.substring(1)]
                return [item: value]
            }
            if (value instanceof List) {
                def children = value.collect { convertIngredient(it) }
                if (children.isEmpty()) throw new GradleException('Empty recipe ingredient alternatives')
                return children.size() == 1 ? children[0] : [type: 'neoforge:compound', children: children]
            }
            if (value instanceof Map) {
                def copy = new LinkedHashMap(value)
                if (copy.children instanceof List) copy.children = copy.children.collect { convertIngredient(it) }
                return copy
            }
            throw new GradleException("Unsupported ingredient: " + value)
        }
        def recipes = fileTree(destinationDir) {
            include 'data/**/recipe/**/*.json'
        }
        recipes.each { recipeFile ->
            def data = slurper.parse(recipeFile)
            if (data.key instanceof Map) data.key = data.key.collectEntries { k, v -> [(k): convertIngredient(v)] }
            if (data.containsKey('ingredient')) data.ingredient = convertIngredient(data.ingredient)
            if (data.ingredients instanceof List) data.ingredients = data.ingredients.collect { convertIngredient(it) }
            if (data.containsKey('tool')) data.tool = convertIngredient(data.tool)
            if (data.containsKey('base')) data.base = convertIngredient(data.base)
            if (data.containsKey('addition')) data.addition = convertIngredient(data.addition)
            if (data.containsKey('template')) data.template = convertIngredient(data.template)
            recipeFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n', 'UTF-8')
        }
        logger.lifecycle("Normalized " + recipes.files.size() + " recipe resources for NeoForge 1.21.1")

        // 1.21.1 loot pools use conditions[] and functions[].
        // Convert only loot nodes; never touch number providers, item
        // predicates, counts or probabilities.
        def condition
        def lootFunction
        def node
        condition = { value ->
            if (!(value instanceof Map)) throw new GradleException("Invalid loot condition: " + value)
            def out = new LinkedHashMap(value)
            if (out.type instanceof String) {
                out.condition = out.remove('type')
            }
            if (out.condition == 'farmersdelight:can_item_perform_ability')
                out.condition = 'neoforge:can_item_perform_ability'
            if (out.condition == 'minecraft:match_block') {
                if (!(out.blocks instanceof String) || out.blocks.startsWith('#'))
                    throw new GradleException("Unsupported match_block form: " + out)
                out.condition = 'minecraft:block_state_property'
                out.block = out.remove('blocks')
                out.properties = out.remove('state') ?: [:]
            }
            if (out.term instanceof Map) out.term = condition(out.term)
            if (out.terms instanceof List) out.terms = out.terms.collect { condition(it) }
            return out
        }
        lootFunction = { value ->
            def out = new LinkedHashMap(value)
            if (out.type instanceof String) out.function = out.remove('type')
            return node(out)
        }
        node = { value ->
            def out = new LinkedHashMap(value)
            def conditions = []
            if (out.conditions instanceof List) conditions.addAll(out.remove('conditions'))
            if (out.condition instanceof Map) conditions.add(out.remove('condition'))
            if (!conditions.isEmpty()) out.conditions = conditions.collect { condition(it) }
            def functions = []
            if (out.functions instanceof List) functions.addAll(out.remove('functions'))
            if (out.modifier instanceof List) functions.addAll(out.remove('modifier'))
            if (out.modifier instanceof Map) functions.add(out.remove('modifier'))
            if (!functions.isEmpty()) out.functions = functions.collect { lootFunction(it) }
            ['pools', 'entries', 'children'].each { key ->
                if (out[key] instanceof List) out[key] = out[key].collect { node(it) }
            }
            return out
        }
        def lootTables = fileTree(destinationDir) {
            include 'data/**/loot_table/**/*.json'
        }
        lootTables.each { lootFile ->
            def data = node(slurper.parse(lootFile))
            lootFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n', 'UTF-8')
        }
        logger.lifecycle("Normalized " + lootTables.files.size() + " loot table resources for NeoForge 1.21.1")

    }

}

jar {
    from('LICENSE') { rename { "${it}_${project.archives_base_name}" } }
    from('NOTICE') { into('META-INF') }
    from('THIRD_PARTY_NOTICES.md') { into('META-INF') }
    from('CREDIT.md') { into('META-INF') }
    from('docs/FDR_CRATES_LICENSE.md') { into('META-INF') }
}
